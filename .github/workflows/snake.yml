name: Generate space snake

# Builds both contribution visuals (orbit calendar + snake) and publishes them together,
# because the publish step replaces the whole "output" branch.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/contrib-orbit.mjs"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render the contribution orbit calendar
        run: node .github/scripts/contrib-orbit.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_FILE: dist/contrib-orbit.svg

      - name: Render the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-space.svg?color_snake=#22D3EE&color_dots=#1B2150,#312E81,#4F46E5,#8B5CF6,#22D3EE

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
